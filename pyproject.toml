[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asktell-bo"
version = "0.1.0"
description = "Ask-tell Bayesian optimization: suggest parameters, run your program, observe results."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Xuerui Wei", email = "wxrui2013@gmail.com"},
]
keywords = ["bayesian-optimization", "botorch", "ask-tell", "black-box"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Private :: Do Not Upload",
]
dependencies = [
  "numpy>=1.26.0",
  "torch>=2.2.0",
  "botorch>=0.12.0",
  "gpytorch>=1.13.0",
]

[project.optional-dependencies]
demo = ["matplotlib>=3.8.0"]

[project.scripts]
asktell = "asktell.core:main"
asktell-eval = "asktell.eval_external:main"

[tool.setuptools.packages.find]
where = ["src"]
